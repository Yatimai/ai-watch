name: Daily Briefing

on:
  schedule:
    - cron: '0 7 * * *'  # 7h UTC chaque jour
  workflow_dispatch:      # permet de lancer manuellement

jobs:
  run-agent:
    name: Generate Daily Briefing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.cli run

      - name: Verify briefing was produced
        run: |
          f="briefings/briefing-$(date -u +%Y-%m-%d).md"
          test -s "$f" || { echo "::error::briefing file missing or empty: $f"; exit 1; }

      - name: Commit and push briefing
        run: |
          set -e
          git config user.name "Yatimai"
          git config user.email "turpingilles15@gmail.com"
          git add briefings/
          git diff --staged --quiet || git commit -m "briefing: $(date +%Y-%m-%d)"
          git push

      - name: Trigger GitHub Pages deploy
        if: success()
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs after the push on purpose: a malformed briefing is still worth
      # keeping, so we publish it and fail the run loudly instead of losing
      # the day. Catches wrapper leaks and truncated output.
      - name: Verify briefing shape
        run: |
          f="briefings/briefing-$(date -u +%Y-%m-%d).md"
          head -n 1 "$f" | grep -q '^# ' || {
            echo "::error::$f does not start with its title, model wrapper leaked"
            head -n 5 "$f"
            exit 1
          }
          n=$(grep -c '^### ' "$f" || true)
          test "$n" -ge 6 || {
            echo "::error::$f only has $n items, expected at least 6"
            exit 1
          }
